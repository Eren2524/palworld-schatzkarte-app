name: IPA bauen
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: App bauen (unsigniert)
        run: |
          xcodebuild -project PalKarte.xcodeproj -scheme PalKarte -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Schatzkarte.app Payload/
          zip -qry Schatzkarte.ipa Payload
          ls -la Schatzkarte.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Schatzkarte-IPA
          path: Schatzkarte.ipa
