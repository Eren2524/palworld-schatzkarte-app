name: PalKarte
options:
  bundleIdPrefix: com.eren2524
  deploymentTarget:
    iOS: "16.0"
targets:
  PalKarte:
    type: application
    platform: iOS
    sources:
      - path: PalKarte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eren2524.palkarte
        PRODUCT_NAME: Schatzkarte
        INFOPLIST_KEY_CFBundleDisplayName: Schatzkarte
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.1"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
